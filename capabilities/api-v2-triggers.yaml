        destructive: false
        idempotent: true
      call: api-v2-triggers.gettrigger
      with:
        triggerPath: tools.triggerPath
      outputParameters:
      - type: object
        mapping: $.
    - name: google-tag-manager-update-trigger
      description: Google Tag Manager Update a Trigger
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: api-v2-triggers.updatetrigger
      with:
        triggerPath: tools.triggerPath
        fingerprint: tools.fingerprint
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: google-tag-manager-delete-trigger
      description: Google Tag Manager Delete a Trigger
      hints:
        readOnly: false

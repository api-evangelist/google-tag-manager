        destructive: false
        idempotent: false
      call: api-v2-triggers.createtrigger
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: google-tag-manager-get-trigger
      description: Google Tag Manager Get a Trigger
      hints:

naftiko: 1.0.0-alpha2
info:
  label: Google Tag Manager API
  description: 'Google Tag Manager API. 6 operations. Lead operation: Google Tag Manager List Tags in a Workspace. Self-contained
    Naftiko capability covering one Google Tag Manager business surface.'
  tags:
  - Google Tag Manager
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    GOOGLE_TAG_MANAGER_API_KEY: GOOGLE_TAG_MANAGER_API_KEY
capability:
  consumes:
  - type: http
    namespace: api-v2-general
    baseUri: https://tagmanager.googleapis.com
    description: Google Tag Manager API business capability. Self-contained, no shared references.
    resources:
    - name: tagmanager-v2-parent-tags
      path: /tagmanager/v2/{parent}/tags
      operations:
      - name: listtags
        method: GET
        description: Google Tag Manager List Tags in a Workspace
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: pageToken
          in: query
          type: string
          description: Continuation token for fetching the next page of results.
      - name: createtag
        method: POST
        description: Google Tag Manager Create a Tag
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: tagmanager-v2-tagPath
      path: /tagmanager/v2/{tagPath}
      operations:
      - name: gettag
        method: GET
        description: Google Tag Manager Get a Tag
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: tagPath
          in: path
          type: string
          description: GTM Tag's API relative path, e.g. accounts/{accountId}/containers/{containerId}/workspaces/{workspaceId}/tags/{tagId}.
          required: true
      - name: updatetag
        method: PUT
        description: Google Tag Manager Update a Tag
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: tagPath
          in: path
          type: string
          description: GTM Tag's API relative path.
          required: true
        - name: fingerprint
          in: query
          type: string
          description: When provided, this fingerprint must match the fingerprint of the tag in storage.
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deletetag
        method: DELETE
        description: Google Tag Manager Delete a Tag
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: tagPath
          in: path
          type: string
          description: GTM Tag's API relative path.
          required: true
    - name: tagmanager-v2-tagPath}:revert
      path: /tagmanager/v2/{tagPath}:revert
      operations:
      - name: reverttag
        method: POST
        description: Google Tag Manager Revert Changes to a Tag in a Workspace
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: tagPath
          in: path
          type: string
          description: GTM Tag's API relative path.
          required: true
    authentication:
      type: bearer
      token: '{{env.GOOGLE_TAG_MANAGER_API_KEY}}'
  exposes:
  - type: rest
    namespace: api-v2-general-rest
    port: 8080
    description: REST adapter for Google Tag Manager API. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/tagmanager/v2/{parent}/tags
      name: tagmanager-v2-parent-tags
      description: REST surface for tagmanager-v2-parent-tags.
      operations:
      - method: GET
        name: listtags
        description: Google Tag Manager List Tags in a Workspace
        call: api-v2-general.listtags
        with:
          pageToken: rest.pageToken
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createtag
        description: Google Tag Manager Create a Tag
        call: api-v2-general.createtag
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/tagmanager/v2/{tagpath}
      name: tagmanager-v2-tagpath
      description: REST surface for tagmanager-v2-tagPath.
      operations:
      - method: GET
        name: gettag
        description: Google Tag Manager Get a Tag
        call: api-v2-general.gettag
        with:
          tagPath: rest.tagPath
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: updatetag
        description: Google Tag Manager Update a Tag
        call: api-v2-general.updatetag
        with:
          tagPath: rest.tagPath
          fingerprint: rest.fingerprint
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deletetag
        description: Google Tag Manager Delete a Tag
        call: api-v2-general.deletetag
        with:
          tagPath: rest.tagPath
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/tagmanager/v2/tagpath-revert
      name: tagmanager-v2-tagpath-revert
      description: REST surface for tagmanager-v2-tagPath}:revert.
      operations:
      - method: POST
        name: reverttag
        description: Google Tag Manager Revert Changes to a Tag in a Workspace
        call: api-v2-general.reverttag
        with:
          tagPath: rest.tagPath
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: api-v2-general-mcp
    port: 9090
    transport: http
    description: MCP adapter for Google Tag Manager API. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: google-tag-manager-list-tags
      description: Google Tag Manager List Tags in a Workspace
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: api-v2-general.listtags
      with:
        pageToken: tools.pageToken
      outputParameters:
      - type: object
        mapping: $.
    - name: google-tag-manager-create-tag
      description: Google Tag Manager Create a Tag
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: api-v2-general.createtag
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: google-tag-manager-get-tag
      description: Google Tag Manager Get a Tag
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: api-v2-general.gettag
      with:
        tagPath: tools.tagPath
      outputParameters:
      - type: object
        mapping: $.
    - name: google-tag-manager-update-tag
      description: Google Tag Manager Update a Tag
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: api-v2-general.updatetag
      with:
        tagPath: tools.tagPath
        fingerprint: tools.fingerprint
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: google-tag-manager-delete-tag
      description: Google Tag Manager Delete a Tag
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: api-v2-general.deletetag
      with:
        tagPath: tools.tagPath
      outputParameters:
      - type: object
        mapping: $.
    - name: google-tag-manager-revert-changes
      description: Google Tag Manager Revert Changes to a Tag in a Workspace
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: api-v2-general.reverttag
      with:
        tagPath: tools.tagPath
      outputParameters:
      - type: object
        mapping: $.

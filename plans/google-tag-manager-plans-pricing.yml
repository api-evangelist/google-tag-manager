specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Google Tag Manager
providerId: google-tag-manager
created: '2026-05-04'
modified: '2026-08-13'
generated: '2026-08-13'
method: searched
source: https://marketingplatform.google.com/about/tag-manager/
also:
  compare_versions: https://marketingplatform.google.com/about/tag-manager/compare/
  enterprise_tier: https://marketingplatform.google.com/about/tag-manager-360/
  api_quotas: https://developers.google.com/tag-platform/tag-manager/api/v2/limits-quotas
provenance_note: >-
  Replaces the 2026-05-04 bulk-sweep scaffold (roadmap#35), which invented a
  three-tier "Free / Pro / Enterprise" ladder with fabricated request quotas that
  Google does not publish. Google publishes exactly two commercial tiers for Tag
  Manager and puts no price on the second one.
tags:
  - Analytics
  - Conversion Tracking
  - Marketing
  - Tag Management
  - Tracking
description: >-
  Google Tag Manager has two commercial tiers. The standard product is free with no
  usage-based pricing and no separate charge for the Tag Manager API v2 - API access
  is governed by project quotas, not by a paid plan. The enterprise tier, Tag Manager
  360, is part of Google Marketing Platform; Google publishes a feature comparison
  but no list price, no rate card and no self-serve checkout for it.
currency: USD
billing_periods: []
plan_count: 2
public_pricing: partial
public_pricing_note: >-
  Tier 1 has a published price (free). Tier 2 is contact-sales only - Google
  publishes no number for Tag Manager 360 anywhere on its own properties, so no
  price is recorded here. Third-party estimates circulate but are not the provider's
  published values and are deliberately not captured.
plans:
  - id: google-tag-manager
    name: Google Tag Manager
    type: free
    price: 0
    currency: USD
    billing_period: none
    self_serve: true
    signup: https://tagmanager.google.com/
    description: >-
      The standard, free tier. Web, iOS, Android and server-side containers, tag
      templates, triggers, variables, workspaces, versions, preview/debug and the
      full Tag Manager API v2. There is no charge for API calls.
    included:
      - label: API access
        name: api_access
        type: entitlement
        value: Tag Manager API v2, full read/write surface
      - label: API requests
        name: api_requests
        type: quota
        value: 10000
        unit: requests per Google Cloud project per day
        source: https://developers.google.com/tag-platform/tag-manager/api/v2/limits-quotas
      - label: API request rate
        name: api_rate
        type: quota
        value: 0.25
        unit: queries per second per project (25 per 100s sliding window)
        source: https://developers.google.com/tag-platform/tag-manager/api/v2/limits-quotas
    overage: none
    overage_note: >-
      No overage billing. Exceeding the project quota returns HTTP 403 with reason
      userRateLimitExceeded / quotaExceeded; a higher quota is requested through the
      Google API Console rather than purchased on a plan.
    limits: rate-limits/google-tag-manager-rate-limits.yml
  - id: google-tag-manager-360
    name: Tag Manager 360
    type: enterprise
    price: null
    price_note: >-
      Google publishes no list price for Tag Manager 360 on any of its own
      properties - only a "compare versions" feature matrix against the free tier.
      It is sold as part of Google Marketing Platform rather than self-serve.
      Third-party estimates exist and are deliberately not recorded here.
    currency: null
    billing_period: null
    self_serve: false
    signup: https://marketingplatform.google.com/about/tag-manager-360/
    description: >-
      The enterprise tier of Tag Manager, sold within Google Marketing Platform.
      Adds enterprise workspace, approval, governance and support capabilities on
      top of the standard product, with an SLA and dedicated support.
    included:
      - label: API access
        name: api_access
        type: entitlement
        value: Same Tag Manager API v2 surface as the free tier
    overage: null
    limits: rate-limits/google-tag-manager-rate-limits.yml
notes:
  - >-
    The API is not a separately priced product on either tier. The commercial gate
    on Tag Manager is the product tier, not API metering - which is why the quota in
    rate-limits/ is the real constraint an integrator plans against.

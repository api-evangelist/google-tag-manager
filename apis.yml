aid: google-tag-manager
name: Google Tag Manager
description: >-
  Google Tag Manager is a tag management system that lets teams deploy and update measurement codes and related
  code fragments — collectively known as tags — on a website, mobile app, or server-side container without
  editing site code on every change. The Tag Manager API v2 exposes that configuration programmatically:
  accounts, containers, workspaces, tags, triggers, variables, container versions, and user permissions, across
  web, iOS, Android, AMP, and server-side usage contexts. Changes are staged in a workspace, frozen into an
  immutable container version, and then published to live traffic, with fingerprint-based optimistic concurrency
  guarding every write. Access is OAuth 2.0 only, with seven granular scopes separating read, edit, publish, and
  user-management rights.

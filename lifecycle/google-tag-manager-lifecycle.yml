  note: >-
    v1 of the Tag Manager API was deprecated and shut down; v2 is the current and
    only supported version. Version is pinned in the URL path and in the
    client-library service constructor (tagmanager, v2). Google regenerates a
    machine-readable Discovery Document per revision — revision 20260812 was live
    when probed, which makes the contract itself demonstrably current even though
    there is no dated changelog for the REST API.
deprecation:
  policy_url: null
  policy_published: false
  sunset_header: false
  deprecation_header: false
  note: >-
    Google publishes NO deprecation policy scoped to the Tag Manager API. The Google
    APIs Terms of Service (developers.google.com/terms) contains no deprecation
    clause and no notice period — section 8a instead reserves the right to
    "discontinue the APIs or any portion or feature or your access thereto for any
    reason and at any time." The API emits no RFC 8594 Sunset or Deprecation response
    headers, so there is no runtime signal either. Deprecation, when it happens, is
    communicated through docs, release notes and email.
sla:
  url: null
  uptime_target: null
  note: >-
    No published SLA for the Tag Manager API on the free tier. Tag Manager 360, sold
    within Google Marketing Platform, carries enterprise support terms that are not
    publicly documented.

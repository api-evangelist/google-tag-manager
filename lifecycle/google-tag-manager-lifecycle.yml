correction_note: >-
  Two pointers recorded in the 2026-06-20 round were misattributions and are
  corrected here, both verified on 2026-08-13. (1) status_page was
  status.cloud.google.com — that dashboard covers Google Cloud services only and does
  not list Google Tag Manager, Google Marketing Platform or the Tag Manager API.
  (2) deprecation.policy_url was cloud.google.com/terms/deprecation — the Google
  Cloud Platform deprecation policy, which does not govern a Marketing Platform
  product. Neither surface exists for this API; recording them as present credited
  Google with operational transparency it does not publish for Tag Manager.

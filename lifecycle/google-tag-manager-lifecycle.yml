status_page_note: >-
  Google publishes no status page or incident dashboard for Google Tag Manager.
  status.cloud.google.com covers Google Cloud services and does not list Tag Manager,
  Marketing Platform or the Tag Manager API (verified 2026-08-13). ads.google.com/status
  is the Google Ads publisher dashboard and likewise does not cover Tag Manager.
  Third-party monitors (StatusGator, UptimeRobot) exist but are not provider-published
  and are not recorded as this provider's status surface.

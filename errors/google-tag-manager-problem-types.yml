  source_operations:
  - openapi/google-tag-manager-accounts-api-openapi.yml#getAccount
  - openapi/google-tag-manager-containers-api-openapi.yml#getContainer
  retryable: false
  remediation: Verify the resource path and that the resource exists.
- status: 409
  reason: conflict
  status_enum: ABORTED
  title: Fingerprint mismatch (conflict)
  description: >-
    The supplied fingerprint does not match the stored resource fingerprint,
    indicating a concurrent modification.
  source_operations:
  - openapi/google-tag-manager-accounts-api-openapi.yml#updateAccount
  - openapi/google-tag-manager-tagmanager-api-openapi.yml#updateTag
  retryable: false
  remediation: Re-fetch the resource to obtain the current fingerprint, reapply changes, and retry.
- status: 500
  reason: backendError
  status_enum: INTERNAL
  title: Internal server error
  description: An unexpected error occurred on the Tag Manager backend.
  retryable: true
  remediation: Retry with exponential backoff; if persistent, contact Google support.
- status: 503
  reason: backendError
  status_enum: UNAVAILABLE
  title: Service unavailable
  description: The service is temporarily unavailable.
  retryable: true
  remediation: Retry with exponential backoff.
absent:
  - code: 429
    note: >-
      This API does NOT use 429 for throttling. The derived pass assumed it; Google's
      quota docs specify 403 + usageLimits. Recorded so the wrong assumption is not
      re-derived on a later round.

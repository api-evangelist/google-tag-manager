  - openapi/google-tag-manager-containers-api-openapi.yml#createContainer
  retryable: false
  remediation: Correct the request payload/parameters and retry.
- status: 403
  reason: accessNotConfigured
  domain: usageLimits
  status_enum: PERMISSION_DENIED
  title: Access Not Configured
  description: >-
    The Tag Manager API has not been enabled for the calling Google Cloud project.
  verbatim_message: >-
    Access Not Configured. Please use Google Developers Console to activate the API
    for your project.
  retryable: false
  remediation: Enable the Tag Manager API for the project in the Google API Console, then retry.
  source: https://developers.google.com/tag-platform/tag-manager/api/v2/errors
  note: Google's error reference shows this reason on both 400 and 403 responses.
- status: 401
  reason: authError
  status_enum: UNAUTHENTICATED
  title: Authentication required
  description: Missing or invalid OAuth 2.0 credentials.
  source_operations:
  - openapi/google-tag-manager-accounts-api-openapi.yml#listAccounts
  retryable: false
  remediation: Provide a valid OAuth 2.0 bearer token with the required tagmanager scope.
- status: 403
  reason: insufficientPermissions
  status_enum: PERMISSION_DENIED
  title: Insufficient permissions
  description: The authenticated user lacks the required permission/scope for the resource.
  source_operations:
  - openapi/google-tag-manager-accounts-api-openapi.yml#listAccounts
  retryable: false
  remediation: Grant the user the needed account/container permission and request the matching OAuth scope.
- status: 403
  reason: userRateLimitExceeded
  domain: usageLimits
  status_enum: RESOURCE_EXHAUSTED
  title: Per-user rate limit exceeded
  description: >-
    The calling user exceeded the sustained request rate (0.25 QPS per project over a
    100-second sliding window).
  retryable: true
  remediation: Retry with exponential backoff per retry_policy.
  source: https://developers.google.com/tag-platform/tag-manager/api/v2/errors
- status: 403
  reason: quotaExceeded
  domain: usageLimits
  status_enum: RESOURCE_EXHAUSTED
  title: Quota exceeded
  description: >-
    The Google Cloud project exceeded its Tag Manager API quota (10,000 requests per
    project per day; resets at midnight PST).
  retryable: true
  remediation: >-
    Retry with exponential backoff; if the daily quota is genuinely exhausted, wait
    for the reset or request a higher quota via the API Console.
  source: https://developers.google.com/tag-platform/tag-manager/api/v2/limits-quotas
- status: 404
  reason: notFound
  status_enum: NOT_FOUND
  title: Resource not found

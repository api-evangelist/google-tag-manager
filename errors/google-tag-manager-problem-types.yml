format: google-json-error
upgrade_note: >-
  Upgraded 2026-08-13 from derived to searched against Google's published error
  reference. Two corrections to the derived pass: (1) quota exhaustion on this API
  returns HTTP 403 with domain "usageLimits", NOT the 429 the derived pass assumed
  from generic REST convention; (2) source_operation paths now point at the refined
  per-tag specs in openapi/ rather than the retired combined api-v2 file.
envelope:
  container: error
  shape: |
    {
      "error": {
        "errors": [
          { "domain": "[error domain]", "reason": "[error code]", "message": "[human-readable description]" }
        ],
        "code": [http status code],
        "message": "[error message]"
      }
    }
  fields:
    code: HTTP status code (integer)
    message: human-readable error message
    status: canonical Google API status enum (e.g. NOT_FOUND, PERMISSION_DENIED)
    errors: array of {message, domain, reason} detail objects
  content_type: application/json
  note: >-
    Google Tag Manager API v2 returns the standard Google JSON error format, not RFC
    9457 application/problem+json. The machine-readable discriminator an agent should
    branch on is errors[].reason (with errors[].domain for the class), not the prose
    message - Google states explicitly that the description text "could change at any
    time so applications should not depend on the actual description text."
  agent_guidance: >-
    Branch on error.errors[0].reason. Treat userRateLimitExceeded and quotaExceeded
    as retryable; treat everything else as terminal until the request is changed.
retry_policy:
  strategy: exponential-backoff
  formula: (2 ^ n) + random_number_milliseconds
  n_starts_at: 0
  max_attempts: 5
  max_elapsed_seconds: 32
  retryable_reasons:
    - userRateLimitExceeded
    - quotaExceeded
  source: https://developers.google.com/tag-platform/tag-manager/api/v2/errors
problems:
- status: 400
  reason: badRequest
  status_enum: INVALID_ARGUMENT
  title: Invalid request
  description: Request body or parameters failed validation (e.g. malformed entity, bad fingerprint format).
  source_operations:

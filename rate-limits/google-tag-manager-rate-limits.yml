specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Google Tag Manager
providerId: google-tag-manager
created: '2026-05-04'
modified: '2026-08-13'
generated: '2026-08-13'
method: searched
source: https://developers.google.com/tag-platform/tag-manager/api/v2/limits-quotas
also:
  errors_and_retry: https://developers.google.com/tag-platform/tag-manager/api/v2/errors
provenance_note: >-
  Replaces the 2026-05-04 bulk-sweep scaffold (roadmap#35), whose X-RateLimit-*
  headers and 429 status were generic defaults that the Tag Manager API does not
  actually emit. Every value below is read from Google's published limits-and-quotas
  and error-responses pages on 2026-08-13.
tags:
  - Analytics
  - Conversion Tracking
  - Marketing
  - Tag Management
  - Tracking
  - Rate Limiting
  - Quotas
  - Throttling
description: >-
  Published request quotas for the Google Tag Manager API v2. Quotas are enforced
  per Google Cloud project (not per API key or per user), across a rolling window,
  and exhaustion is signalled with HTTP 403 and a reason code in the Google JSON
  error envelope - not the more common HTTP 429.
headers:
  limit: null
  remaining: null
  reset: null
  retryAfter: null
  policy: null
  note: >-
    Google publishes NO rate-limit response headers for the Tag Manager API. There
    is no X-RateLimit-*, no RateLimit-*, and no Retry-After on quota exhaustion. An
    agent cannot read remaining budget from a successful response; the only runtime
    signal is the failure itself (403 + reason code), which is why the docs prescribe
    client-side exponential backoff rather than header-driven pacing.
responseCodes:
  throttled: 403
  throttled_note: >-
    Quota exhaustion returns HTTP 403 Forbidden (not 429) with a Google JSON error
    envelope carrying domain "usageLimits" and one of the retryable reason codes below.
  retryable_reasons:
    - userRateLimitExceeded
    - quotaExceeded
retry:
  strategy: exponential-backoff
  formula: (2 ^ n) + random_number_milliseconds
  max_attempts: 5
  max_elapsed_seconds: 32
  source: https://developers.google.com/tag-platform/tag-manager/api/v2/errors
limit_count: 2
limits:
  - id: requests-per-project-per-day
    scope: project
    description: Total Tag Manager API v2 requests per Google Cloud project per day.
    limit: 10000
    unit: requests
    window: 1 day
    reset: Daily quotas reset at midnight PST.
    adjustable: true
    adjustment_path: >-
      Higher quotas can be requested through the Google API Console "Edit Quotas"
      / quota-increase request flow for the project.
    source: https://developers.google.com/tag-platform/tag-manager/api/v2/limits-quotas
  - id: queries-per-second-per-project
    scope: project
    description: >-
      Sustained query rate per Google Cloud project, enforced over a 100-second
      sliding window.
    limit: 0.25
    unit: queries per second
    window: 100 second sliding window
    burst: 25 requests per 100 seconds
    adjustable: true
    adjustment_path: >-
      Higher quotas can be requested through the Google API Console "Edit Quotas"
      / quota-increase request flow for the project.
    source: https://developers.google.com/tag-platform/tag-manager/api/v2/limits-quotas
notes:
  - >-
    The quota is per Google Cloud project, so every user of a single integration
    shares one 10,000/day and 0.25 QPS budget - the binding constraint for any
    multi-tenant tool built on this API.
  - >-
    Google's limits-and-quotas page documents request quotas only; it does not
    publish per-user request limits or entity-count caps (containers, workspaces,
    tags per container) on this page.

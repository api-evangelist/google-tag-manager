                    consentStatus: notSet
      responses:
        '200':
          description: Successful response containing the updated tag.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
              examples:
                Updatetag200Example:
                  summary: Default updateTag 200 response
                  x-microcks-default: true
                  value:
                    path: example_value
                    accountId: '500123'
                    containerId: '500123'
                    workspaceId: '500123'
                    tagId: '500123'
                    name: Example Title
                    type: example_value
                    liveOnly: true
                    priority:
                      type: typeUnspecified
                      key: example_value
                      value: example_value
                      list:
                      - {}
                      map:
                      - {}
                      isWeakReference: true
                    notes: example_value

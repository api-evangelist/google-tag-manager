      parameters:
      - name: tagPath
        in: path
        required: true
        description: GTM Tag's API relative path, e.g. accounts/{accountId}/containers/{containerId}/workspaces/{workspaceId}/tags/{tagId}.
        schema:
          type: string
        example: example_value
      responses:
        '200':
          description: Successful response containing the tag.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
              examples:
                Gettag200Example:
                  summary: Default getTag 200 response
                  x-microcks-default: true
                  value:
                    path: example_value
                    accountId: '500123'
                    containerId: '500123'
                    workspaceId: '500123'
                    tagId: '500123'
                    name: Example Title
                    type: example_value
                    liveOnly: true
                    priority:
                      type: typeUnspecified
                      key: example_value
                      value: example_value
                      list:
                      - {}
                      map:
                      - {}
                      isWeakReference: true
                    notes: example_value
                    scheduleStartMs: example_value
                    scheduleEndMs: example_value
                    parameter:
                    - type: typeUnspecified
                      key: example_value
                      value: example_value
                      list: {}
                      map: {}
                      isWeakReference: true
                    fingerprint: example_value
                    firingTriggerId:
                    - example_value
                    blockingTriggerId:
                    - example_value

      - Tagmanager
      parameters:
      - $ref: '#/components/parameters/parentParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Tag'
            examples:
              CreatetagRequestExample:
                summary: Default createTag request
                x-microcks-default: true
                value:
                  path: example_value
                  accountId: '500123'
                  containerId: '500123'
                  workspaceId: '500123'
                  tagId: '500123'
                  name: Example Title
                  type: example_value
                  liveOnly: true
                  priority:
                    type: typeUnspecified
                    key: example_value
                    value: example_value
                    list:
                    - {}
                    map:
                    - {}
                    isWeakReference: true
                  notes: example_value
                  scheduleStartMs: example_value
                  scheduleEndMs: example_value
                  parameter:
                  - type: typeUnspecified
                    key: example_value
                    value: example_value
                    list: {}
                    map: {}
                    isWeakReference: true
                  fingerprint: example_value
                  firingTriggerId:
                  - example_value
                  blockingTriggerId:
                  - example_value
                  setupTag:
                  - tagName: example_value
                    stopOnSetupFailure: true
                  teardownTag:
                  - tagName: example_value
                    stopTeardownOnFailure: true
                  parentFolderId: '500123'
                  tagFiringOption: tagFiringOptionUnspecified
                  tagManagerUrl: https://www.example.com
                  paused: true
                  monitoringMetadata:
                    type: typeUnspecified
                    key: example_value
                    value: example_value
                    list:
                    - {}
                    map:
                    - {}
                    isWeakReference: true
                  monitoringMetadataTagNameKey: example_value
                  consentSettings:
                    consentStatus: notSet
      responses:
        '200':
          description: Successful response containing the created tag.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
              examples:
                Createtag200Example:
                  summary: Default createTag 200 response
                  x-microcks-default: true
                  value:
                    path: example_value
                    accountId: '500123'
                    containerId: '500123'
                    workspaceId: '500123'
                    tagId: '500123'
                    name: Example Title
                    type: example_value
                    liveOnly: true
                    priority:
                      type: typeUnspecified
                      key: example_value
                      value: example_value
                      list:
                      - {}
                      map:
                      - {}
                      isWeakReference: true
                    notes: example_value
                    scheduleStartMs: example_value
                    scheduleEndMs: example_value
                    parameter:
                    - type: typeUnspecified
                      key: example_value
                      value: example_value
                      list: {}
                      map: {}
                      isWeakReference: true
                    fingerprint: example_value
                    firingTriggerId:
                    - example_value
                    blockingTriggerId:
                    - example_value
                    setupTag:
                    - tagName: example_value
                      stopOnSetupFailure: true
                    teardownTag:
                    - tagName: example_value
                      stopTeardownOnFailure: true
                    parentFolderId: '500123'
                    tagFiringOption: tagFiringOptionUnspecified
                    tagManagerUrl: https://www.example.com
                    paused: true
                    monitoringMetadata:
                      type: typeUnspecified
                      key: example_value
                      value: example_value
                      list:
                      - {}
                      map:
                      - {}
                      isWeakReference: true
                    monitoringMetadataTagNameKey: example_value
                    consentSettings:
                      consentStatus: notSet

        required: true
        description: GTM Trigger's API relative path.
        schema:
          type: string
        example: example_value
      responses:
        '200':
          description: Successful response confirming the trigger was reverted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevertTriggerResponse'
              examples:
                Reverttrigger200Example:
                  summary: Default revertTrigger 200 response
                  x-microcks-default: true
                  value:
                    trigger:
                      path: example_value
                      accountId: '500123'
                      containerId: '500123'
                      workspaceId: '500123'
                      triggerId: '500123'
                      name: Example Title
                      type: eventTypeUnspecified
                      customEventFilter:
                      - {}
                      filter:
                      - {}
                      autoEventFilter:
                      - {}
                      fingerprint: example_value
                      parentFolderId: '500123'
                      tagManagerUrl: https://www.example.com
                      notes: example_value
                      parameter:
                      - {}
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  schemas:
    Condition:
      type: object
      description: Represents a predicate that is evaluated against a data layer value or variable. Used in trigger filter conditions.
      properties:
        type:
          type: string
          description: The type of operator for this condition.
          enum:
          - conditionTypeUnspecified
          - equals
          - contains
          - startsWith
          - endsWith
          - matchRegex
          - greater
          - greaterOrEquals
          - less
          - lessOrEquals
          - cssSelector
          - urlMatches
          example: conditionTypeUnspecified
        parameter:
          type: array
          description: A list of named parameters (key/value), depending on the condition's type. The first parameter is the left-hand operand, the second is the right-hand operand.
          items:
            $ref: '#/components/schemas/Parameter'
          example: []
    RevertTriggerResponse:
      type: object
      description: The result of reverting a trigger in a workspace.
      properties:
        trigger:
          $ref: '#/components/schemas/Trigger'
    ListTriggersResponse:
      type: object
      description: List Triggers Response.
      properties:
        trigger:
          type: array
          description: All GTM Triggers of a GTM Container Workspace.
          items:
            $ref: '#/components/schemas/Trigger'
          example: []
        nextPageToken:
          type: string
          description: Continuation token for fetching the next page of results.
          example: example_value
    Parameter:
      type: object
      description: Represents a Google Tag Manager Parameter. Parameters are key-value pairs that configure tags, triggers, and variables.
      properties:
        type:
          type: string
          description: The parameter type.
          enum:
          - typeUnspecified
          - template
          - integer
          - boolean
          - list
          - map
          - triggerReference
          - tagReference
          example: typeUnspecified
        key:
          type: string
          description: The named key that uniquely identifies a parameter. Required for top-level parameters, as well as map values. Ignored for list values.
          example: example_value
        value:
          type: string
          description: A parameter's value (may contain variable references) as appropriate to the specified type.
          example: example_value
        list:
          type: array
          description: This list parameter's parameters (keys will be ignored). Used when type is list.
          items:
            $ref: '#/components/schemas/Parameter'
          example: []
        map:
          type: array
          description: This map parameter's parameters (must have keys; keys must be unique). Used when type is map.
          items:
            $ref: '#/components/schemas/Parameter'
          example: []
        isWeakReference:
          type: boolean
          description: Whether or not the parameter is a weak reference. Used to determine which parameters should be included in exported containers.
          example: true
      required:
      - type
    Trigger:
      type: object
      description: Represents a Google Tag Manager Trigger. A trigger defines conditions under which tags should fire, such as page views, clicks, form submissions, or custom events.
      properties:
        path:
          type: string
          description: GTM Trigger's API relative path.
          readOnly: true
          example: example_value
        accountId:
          type: string
          description: GTM Account ID.
          readOnly: true
          example: '500123'
        containerId:
          type: string
          description: GTM Container ID.
          readOnly: true
          example: '500123'
        workspaceId:
          type: string
          description: GTM Workspace ID.
          readOnly: true
          example: '500123'
        triggerId:
          type: string
          description: The Trigger ID uniquely identifies the GTM Trigger.
          readOnly: true
          example: '500123'
        name:
          type: string
          description: Trigger display name.
          example: Example Title
        type:
          type: string
          description: Defines the data layer event that causes this trigger.
          enum:
          - eventTypeUnspecified
          - pageview
          - domReady
          - windowLoaded
          - customEvent
          - triggerGroup
          - init
          - consentInit
          - serverPageview
          - always
          - firebaseAppException
          - firebaseAppUpdate
          - firebaseCampaign
          - firebaseFirstOpen
          - firebaseInAppPurchase
          - firebaseNotificationDismiss
          - firebaseNotificationForeground
          - firebaseNotificationOpen
          - firebaseNotificationReceive
          - firebaseOsUpdate
          - firebaseSessionStart
          - firebaseUserEngagement
          - formSubmission
          - click
          - linkClick
          - jsError
          - historyChange
          - timer
          - ampClick
          - ampTimer
          - ampScroll
          - ampVisibility
          - youTubeVideo
          - scrollDepth
          - elementVisibility
          example: eventTypeUnspecified
        customEventFilter:
          type: array
          description: Used in the case of custom event, which is fired if and only if all Conditions are true.
          items:
            $ref: '#/components/schemas/Condition'
          example: []
        filter:
          type: array
          description: The trigger will only fire if and only if all Conditions are true.
          items:
            $ref: '#/components/schemas/Condition'
          example: []
        autoEventFilter:
          type: array
          description: Used in the case of auto event tracking for filtering events.
          items:
            $ref: '#/components/schemas/Condition'
          example: []
        waitForTags:
          $ref: '#/components/schemas/Parameter'
        checkValidation:
          $ref: '#/components/schemas/Parameter'
        waitForTagsTimeout:
          $ref: '#/components/schemas/Parameter'
        uniqueTriggerId:
          $ref: '#/components/schemas/Parameter'
        eventName:
          $ref: '#/components/schemas/Parameter'
        interval:
          $ref: '#/components/schemas/Parameter'
        limit:
          $ref: '#/components/schemas/Parameter'
        fingerprint:
          type: string
          description: The fingerprint of the GTM Trigger as computed at storage time. This value is recomputed whenever the trigger is modified.
          readOnly: true
          example: example_value
        parentFolderId:
          type: string
          description: Parent folder ID.
          example: '500123'
        selector:
          $ref: '#/components/schemas/Parameter'
        intervalSeconds:
          $ref: '#/components/schemas/Parameter'
        maxTimerLengthSeconds:
          $ref: '#/components/schemas/Parameter'
        verticalScrollPercentageList:
          $ref: '#/components/schemas/Parameter'
        horizontalScrollPercentageList:
          $ref: '#/components/schemas/Parameter'
        visibilitySelector:
          $ref: '#/components/schemas/Parameter'
        visiblePercentageMin:
          $ref: '#/components/schemas/Parameter'
        visiblePercentageMax:
          $ref: '#/components/schemas/Parameter'
        continuousTimeMinMilliseconds:
          $ref: '#/components/schemas/Parameter'
        totalTimeMinMilliseconds:
          $ref: '#/components/schemas/Parameter'
        tagManagerUrl:
          type: string
          format: uri
          description: Auto-generated link to the tag manager UI.
          readOnly: true
          example: https://www.example.com
        notes:
          type: string
          description: User notes on how to apply this trigger in the container.
          example: example_value
        parameter:
          type: array
          description: Additional parameters for the trigger.
          items:
            $ref: '#/components/schemas/Parameter'
          example: []
      required:
      - name
      - type
  parameters:
    parentParam:
      name: parent
      in: path
      required: true
      description: GTM parent resource's API relative path, e.g. accounts/{accountId} for listing containers.
      schema:
        type: string
  securitySchemes:
    oauth2:
      type: oauth2
      description: OAuth 2.0 authentication for Google Tag Manager API.
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.google.com/o/oauth2/v2/auth
          tokenUrl: https://oauth2.googleapis.com/token
          scopes:
            tagmanager.readonly: View your Google Tag Manager container and its subcomponents.
            tagmanager.edit.containers: Manage your Google Tag Manager container and its subcomponents, excluding versioning and publishing.
            tagmanager.manage.accounts: View and manage your Google Tag Manager accounts.
            tagmanager.manage.users: Manage user permissions of your Google Tag Manager account and container.
            tagmanager.publish: Publish your Google Tag Manager container versions.
            tagmanager.edit.containerversions: Manage your Google Tag Manager container versions.
            tagmanager.delete.containers: Delete your Google Tag Manager containers.
externalDocs:
  description: Google Tag Manager API Documentation
  url: https://developers.google.com/tag-platform/tag-manager/api/v2

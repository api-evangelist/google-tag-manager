overlay: 1.0.0
info:
  title: API Evangelist enhancements for Google Tag Manager API v2
  version: 1.0.0
extends: openapi/google-tag-manager-api-v2-openapi.yml
actions:
- target: $.info
  update:
    x-apievangelist-enriched: '2026-06-20'
    x-apievangelist-provider: google-tag-manager
    x-apievangelist-artifacts:
      authentication: authentication/google-tag-manager-authentication.yml
      scopes: scopes/google-tag-manager-scopes.yml
      errors: errors/google-tag-manager-problem-types.yml
      lifecycle: lifecycle/google-tag-manager-lifecycle.yml
      conventions: conventions/google-tag-manager-conventions.yml
      data_model: data-model/google-tag-manager-data-model.yml
      conformance: conformance/google-tag-manager-conformance.yml
      packages: packages/google-tag-manager-packages.yml
      agentic_access: agentic-access/google-tag-manager-agentic-access.yml
- target: $.info
  update:
    x-apievangelist-pagination:
      style: cursor
      request_param: pageToken
      response_field: nextPageToken
    x-apievangelist-concurrency:
      style: optimistic
      mechanism: fingerprint
      note: >-
        Mutating operations accept a fingerprint query parameter; the request
        succeeds only when it matches the stored resource fingerprint, otherwise
        HTTP 409 is returned.
- target: $.servers
  update:
    x-apievangelist-note: >-
      Single production host. Server-side tagging containers run on
      customer-provisioned infrastructure and are configured, not called, via
      this API.
